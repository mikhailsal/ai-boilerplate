# The single policy source of this repository. Field reference:
# docs/reference/policy.schema.json (generated by `quality policy schema --write`).
schema_version = 1

[repository]
mode = "maintainer"
default_branch = "main"

[thresholds]
source_file_lines = { warning = 250, error = 400 }
function_code_lines = { error = 50 }
cyclomatic_complexity = { error = 10 }
nesting_depth = { warning = 3, error = 4 }
parameters = { warning = 5 }
doc_page_lines = 300
doc_page_words = 2000
agents_lines = 150
agents_words = 1000
blob_bytes = 1048576

[coverage]
line = 80
branch = 70
changed_lines = 90
new_file_must_be_covered = true

[[components]]
id = "quality-core"
role = "tooling"
profile = "python"
root = "tools/quality"
source = ["src"]
tests = { unit = ["tests/unit"], e2e = ["tests/e2e"], acceptance = ["tests/acceptance"] }
capabilities = ["cli"]
scenarios = "scenarios.toml"

# Decision 0003: packages depend only on packages listed after them.
[components.architecture]
layers = [
    "cli",
    "catalog",
    "testkit",
    "engine",
    "scenarios",
    "toolchain",
    "hooks",
    "ci",
    "rules",
    "adapters",
    "reports",
    "coverage",
    "testing",
    "boundedio",
    "metrics",
    "discovery",
    "gitio",
    "policy",
    "process",
    "diagnostics",
]
modules = [
    { name = "cli", paths = ["src/quality/cli/**", "src/quality/__main__.py"] },
    { name = "catalog", paths = ["src/quality/catalog.py"] },
    { name = "testkit", paths = ["src/quality/testkit/**"] },
    { name = "engine", paths = ["src/quality/engine/**"] },
    { name = "scenarios", paths = ["src/quality/scenarios/**"] },
    { name = "toolchain", paths = ["src/quality/toolchain/**"] },
    { name = "hooks", paths = ["src/quality/hooks/**"] },
    { name = "ci", paths = ["src/quality/ci/**"] },
    { name = "rules", paths = ["src/quality/rules/**"] },
    { name = "adapters", paths = ["src/quality/adapters/**"] },
    { name = "reports", paths = ["src/quality/reports/**"] },
    { name = "coverage", paths = ["src/quality/coverage/**"] },
    { name = "testing", paths = ["src/quality/testing/**"] },
    { name = "boundedio", paths = ["src/quality/boundedio.py"] },
    { name = "metrics", paths = ["src/quality/metrics/**"] },
    { name = "discovery", paths = ["src/quality/discovery/**"] },
    { name = "gitio", paths = ["src/quality/gitio/**"] },
    { name = "policy", paths = ["src/quality/policy/**"] },
    { name = "process", paths = ["src/quality/process/**"] },
    { name = "diagnostics", paths = ["src/quality/diagnostics/**"] },
]

# The stdlib launcher behind the root `quality` symlink; it runs on the system
# python3 (3.10 or newer) before the core environment exists (decision 0010).
[[components]]
id = "quality-launcher"
role = "tooling"
profile = "python"
root = "tools/quality/launcher"
source = ["src"]
tests = { unit = ["tests"], e2e = ["e2e"] }
capabilities = ["cli"]
scenarios = "scenarios.toml"

# The Node helper of the TypeScript profile (decision 0011), checked by that
# profile. A helper bundle is active in this maintainer repository (decision 0003).
[[components]]
id = "quality-typescript-helper"
role = "helper"
profile = "typescript"
root = "tools/quality/helpers/typescript"
source = ["src"]
tests = { unit = ["tests"] }
capabilities = []
no_boundary_reason = "Internal helper run by its profile adapter; the core's acceptance suites drive it."

# The Dart helper of the Dart profile (decision 0012), checked by that profile.
[[components]]
id = "quality-dart-helper"
role = "helper"
profile = "dart"
root = "tools/quality/helpers/dart"
source = ["bin", "lib"]
tests = { unit = ["test"] }
capabilities = []
no_boundary_reason = "Internal helper run by its profile adapter; the core's acceptance suites drive it."

# The PHP helper of the PHP profile (decision 0013), checked by that profile.
[[components]]
id = "quality-php-helper"
role = "helper"
profile = "php"
root = "tools/quality/helpers/php"
source = ["bin", "src"]
tests = { unit = ["tests"] }
capabilities = []
no_boundary_reason = "Internal helper run by its profile adapter; the core's acceptance suites drive it."

# The CI wrapper contract (decision 0015): `required` is the one status that
# hosting protection requires, and it fails unless every job below succeeded.
# Control files (derived from this policy, plus `control`) need an owner in
# `codeowners`; changes to them are listed at the merge stage.
[ci]
workflow = ".github/workflows/quality.yml"
aggregate_job = "required"
required_jobs = ["gate", "audit"]
codeowners = ".github/CODEOWNERS"
control = ["ci/**"]

# The dependency audit of merge CI (`quality audit`): advisories with a CVSS
# score at or above `blocking_score` fail, lower ones warn, unscored ones fail.
[audit]
blocking_score = 7.0
unscored = "error"

[[classification]]
pattern = "quality"
category = "config"
reason = "Symlink to the launcher; its target is checked as quality-launcher source."

[[exceptions]]
rule = "suppressions.inline"
path = "tools/quality/src/quality/cli/main.py"
symbol = "noqa: BLE001 - reported as an internal error, never as success"
reason = "The last-resort handler turns any unexpected exception into exit 4, never a pass."
owner = "quality-core maintainers"
review = 2027-04-20

[[exceptions]]
rule = "suppressions.inline"
path = "tools/quality/src/quality/cli/__init__.py"
symbol = "noqa: A002 - argparse keyword"
reason = "The protocol mirrors argparse's add_parser keyword argument named `help`."
owner = "quality-core maintainers"
review = 2027-04-20
