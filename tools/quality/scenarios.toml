# Behavioral scenarios of the quality core (decision 0014). Each one names the
# test cases whose fresh, passing results prove it.
schema_version = 1
component = "quality-core"

[[scenarios]]
id = "artifact-smoke"
summary = "A project exported from the template starts the pinned core through ./quality and answers."
capability = "cli"
level = "e2e"
stage = "commit"
requirements = ["cli.smoke"]
tests = ["tests.e2e.test_artifact::test_the_exported_template_starts_and_answers"]

[[scenarios]]
id = "template-commands"
summary = "The exported template validates its policy and scenarios and reports usage errors."
capability = "cli"
level = "e2e"
stage = "commit"
requirements = ["cli.flows"]
tests = [
    "tests.e2e.test_artifact::test_the_exported_template_validates_its_policy",
    "tests.e2e.test_artifact::test_the_exported_template_lists_its_scenarios",
    "tests.e2e.test_artifact::test_a_usage_error_exits_with_status_2",
]

[[scenarios]]
id = "template-export"
summary = "A fresh clone exports a project without maintainer content, as a repository naming its template."
capability = "cli"
level = "e2e"
stage = "commit"
requirements = ["cli.flows"]
tests = [
    "tests.e2e.test_artifact::test_the_export_leaves_out_the_maintainer_content",
    "tests.e2e.test_artifact::test_the_export_is_a_repository_that_names_its_template",
]

# maintainer-only:begin
# The maintainer acceptance harness is not exported (decision 0016).
[[scenarios]]
id = "commit-gate"
summary = "Real Git hooks accept a clean commit and reject bad staged changes."
capability = "cli"
level = "acceptance"
stage = "merge"
requirements = ["cli.flows"]
tests = [
    "tests.acceptance.test_bootstrap::test_bootstrap_is_idempotent_and_satisfies_doctor",
    "tests.acceptance.test_commit::test_a_clean_change_is_committed",
    "tests.acceptance.test_commit::test_static_findings_reject_the_commit*",
    "tests.acceptance.test_candidate::test_a07_*",
    "tests.acceptance.test_candidate::test_a14_*",
]

[[scenarios]]
id = "merge-gate"
summary = "The merge gate judges the tested merge on plain Linux, whatever CI variables say."
capability = "cli"
level = "acceptance"
stage = "merge"
requirements = ["cli.flows"]
tests = [
    "tests.acceptance.test_gate::test_a_pull_request_passes_on_plain_linux_with_exported_reports",
    "tests.acceptance.test_gate::test_provider_variables_do_not_change_the_verdict",
    "tests.acceptance.test_gate::test_a_stricter_policy_on_main_invalidates_an_earlier_green_result",
]

[[scenarios]]
id = "template-lifecycle"
summary = "An exported project bootstraps with only the Python tooling, then grows to four languages through the hook."
capability = "cli"
level = "acceptance"
stage = "merge"
requirements = ["cli.flows"]
tests = [
    "tests.acceptance.test_template::test_the_export_bootstraps_twice_with_only_the_python_tooling",
    "tests.acceptance.test_template::test_the_first_commit_adds_a_python_component_through_the_hook",
    "tests.acceptance.test_template::test_changing_a_dormant_helper_runs_its_own_checks",
    "tests.acceptance.test_template::test_a16_a_clean_four_language_project_passes_the_hook",
]

[[scenarios]]
id = "browser-gate"
summary = "A browser build proves its Chromium scenarios, and each broken page, scan, or test is found for its own reason."
capability = "cli"
level = "acceptance"
stage = "merge"
requirements = ["cli.flows"]
tests = [
    "tests.acceptance.test_browser_scenarios::test_the_built_counter_proves_its_scenarios_in_every_viewport",
    "tests.acceptance.test_browser_scenarios::test_each_broken_scenario_is_found_for_its_own_reason*",
    "tests.acceptance.test_browser_runs::test_scenarios_without_their_browser_cannot_be_verified",
    "tests.acceptance.test_browser_runs::test_a_run_leaves_no_process_or_temporary_file",
    "tests.acceptance.test_browser_runs::test_the_gate_keeps_the_native_evidence_of_the_scenarios",
]
# maintainer-only:end
