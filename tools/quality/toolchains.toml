# Composer installs a PHP component's locked packages. It is a PHP archive that
# the system PHP runs, the same file on every architecture (decision 0013).
[tools.composer]
version = "2.10.3"
binary = "composer"
checksums = "{url}.sha256sum"

[tools.composer.artifacts.x86_64]
url = "https://getcomposer.org/download/2.10.3/composer.phar"
sha256 = "7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6"
packaging = "binary"

[tools.composer.artifacts.aarch64]
url = "https://getcomposer.org/download/2.10.3/composer.phar"
sha256 = "7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6"
packaging = "binary"

# Exact versions a TypeScript component must lock in its package-lock.json;
# npm installs them from that lockfile (decision 0011).
[packages.npm]
"typescript" = "6.0.3"
"eslint" = "10.13.0"
"@eslint/js" = "10.0.1"
"typescript-eslint" = "8.72.0"
"prettier" = "3.9.10"
"vitest" = "5.0.5"
"@vitest/coverage-v8" = "5.0.5"

# Exact versions a browser component (`target = "browser"`) also locks in its
# package-lock.json; a Node component needs none of them (decision 0017).
[packages.npm-browser]
"react" = "19.3.1"
"react-dom" = "19.3.1"
"@types/react" = "19.3.0"
"@types/react-dom" = "19.3.0"
"vite" = "8.3.5"
"@vitejs/plugin-react" = "6.1.2"
"jsdom" = "30.1.3"
"@testing-library/react" = "16.3.3"
"@testing-library/dom" = "10.4.2"
"@testing-library/user-event" = "14.6.8"
"eslint-plugin-react-hooks" = "7.1.1"
"eslint-plugin-jsx-a11y-x" = "0.2.0"
"globals" = "17.13.0"
"stylelint" = "17.16.0"
"stylelint-config-standard" = "40.0.0"
"stylelint-config-css-modules" = "4.6.0"
"@playwright/test" = "1.64.1"
"@axe-core/playwright" = "4.14.0"

# Exact versions a Dart component must lock in its pubspec.lock (decision 0012).
[packages.pub]
"test" = "1.33.0"
"coverage" = "1.16.0"
"lints" = "6.1.0"

# Exact versions a PHP component must lock in its composer.lock (decision 0013);
# php-code-coverage writes the coverage reports that the gate parses.
[packages.composer]
"phpunit/phpunit" = "13.4.3"
"phpunit/php-code-coverage" = "14.4.1"
"phpstan/phpstan" = "2.3.1"
"friendsofphp/php-cs-fixer" = "3.95.27"

# System programs the PHP profile runs but does not install: PHP itself and the
# Xdebug extension that measures branches, at these minor versions (decision 0013).
[runtimes.php]
version = "8.4"

[runtimes.xdebug]
version = "3.5"
