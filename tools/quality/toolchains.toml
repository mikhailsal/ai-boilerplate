# Pinned standalone tools; see docs/decisions/0001-toolchain-pins.md.
# Checksums come from the vendors' published checksum files, which each tool's
# `checksums` names; `quality tools update` reads them for a new release.
schema_version = 1

[tools.uv]
version = "0.12.24"
binary = "uv"
checksums = "{url}.sha256"

[tools.uv.artifacts.x86_64]
url = "https://github.com/astral-sh/uv/releases/download/0.12.24/uv-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "b4dfaef47d491a7296981f8374a4595f55dbf84e8937c8ecd2983574d8bb3da6"
packaging = "tar"
member = "uv-x86_64-unknown-linux-gnu/uv"

[tools.uv.artifacts.aarch64]
url = "https://github.com/astral-sh/uv/releases/download/0.12.24/uv-aarch64-unknown-linux-gnu.tar.gz"
sha256 = "5231be65f496304623895dacdbf1de8504fec90303684bdf05805aa34414dd21"
packaging = "tar"
member = "uv-aarch64-unknown-linux-gnu/uv"

[tools.gitleaks]
version = "8.30.1"
binary = "gitleaks"
checksums = "https://github.com/gitleaks/gitleaks/releases/download/v{version}/gitleaks_{version}_checksums.txt"

# The rule set embedded in this release, fetched at its tag and pinned by checksum
# so the secret adapter can derive its configuration outside the scanned tree
# (decision 0007).
[tools.gitleaks.extras."gitleaks.toml"]
url = "https://raw.githubusercontent.com/gitleaks/gitleaks/v8.30.1/config/gitleaks.toml"
sha256 = "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf"

