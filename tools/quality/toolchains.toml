# Node.js runs the TypeScript profile's tools; it is installed with its whole
# tree because npm and the libraries live beside the executable. Only
# components with the TypeScript profile need it (decision 0011).
[tools.node]
version = "24.22.0"
binary = "node"
executable = "bin/node"
checksums = "https://nodejs.org/dist/v{version}/SHASUMS256.txt"

[tools.node.artifacts.x86_64]
url = "https://nodejs.org/dist/v24.22.0/node-v24.22.0-linux-x64.tar.xz"
sha256 = "cc2f601cee82d9a5a233302fe307abc600727035fd7d2c3a3571755989e95008"
packaging = "tree"
member = "node-v24.22.0-linux-x64"

[tools.node.artifacts.aarch64]
url = "https://nodejs.org/dist/v24.22.0/node-v24.22.0-linux-arm64.tar.xz"
sha256 = "fef00bb4d36e1c50104a9775a10359beee98f162b4104dd12472c75065c6a143"
packaging = "tree"
member = "node-v24.22.0-linux-arm64"

# The Chrome for Testing headless shell that browser scenarios run in, installed
# with its whole tree like Node.js. Google publishes no SHA-256 for it: these
# were computed from downloads that matched the MD5 digests of the bucket, and
# without a vendor checksum file `quality tools update` refuses the tool. Only
# an active browser component needs it (decision 0017).
[tools.chromium]
version = "156.0.8078.4"
binary = "chrome-headless-shell"

[tools.chromium.artifacts.x86_64]
url = "https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.4/linux64/chrome-headless-shell-linux64.zip"
sha256 = "c3e50596aef52c58f8fda3c6b3411c33d34c88b177b3ed1c2243359fd3b8ba20"
packaging = "tree"
member = "chrome-headless-shell-linux64"

[tools.chromium.artifacts.aarch64]
url = "https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.4/linux-arm64/chrome-headless-shell-linux-arm64.zip"
sha256 = "81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476"
packaging = "tree"
member = "chrome-headless-shell-linux-arm64"

[tools.dart]
