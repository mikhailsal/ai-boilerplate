# Reusable bounded collector; a successful job is not an integration decision.
name: resource-methods-job

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      mode:
        type: string
        required: true
      profile:
        type: string
        required: true
      experiment-ref:
        type: string
        required: true

permissions: {}

jobs:
  collect:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Check out frozen experiment inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the explicitly reviewed phase
        id: phase
        env:
          EXPERIMENT_REF: ${{ inputs.experiment-ref }}
        run: |
          case "$EXPERIMENT_REF" in
            spike/rl00bc-prepare) phase=prepare ;;
            spike/rl00bc-correctness) phase=correctness ;;
            spike/rl00bc-methods) phase=methods ;;
            spike/rl00bc-lifecycle) phase=lifecycle ;;
            spike/rl00bc-nested) phase=nested ;;
            spike/rl00bc-faults) phase=faults ;;
            spike/rl00bc-selection-pressure) phase=selection-pressure ;;
            spike/rl00bc-guardian-race-launch-first) phase=guardian-race-launch-first ;;
            spike/rl00bc-guardian-race-closing-first) phase=guardian-race-closing-first ;;
            spike/rl00bc-compatibility) phase=compatibility ;;
            spike/rl00bc-candidates) phase=candidates ;;
            spike/rl00bc-measure) phase=measure ;;
            spike/rl00bc-adoption) phase=adoption ;;
            *) exit 2 ;;
          esac
          echo "name=$phase" >> "$GITHUB_OUTPUT"
      - name: Install supported system PHP and browser prerequisites
        run: |
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install --yes php8.4-cli php8.4-xml php8.4-mbstring php8.4-zip php8.4-xdebug php8.4-pcov
          sudo phpdismod -v 8.4 -s ALL xdebug pcov
          sudo update-alternatives --set php /usr/bin/php8.4
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Restore architecture-specific package caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/quality
          key: quality-methods-${{ runner.arch }}-${{ hashFiles('tools/quality/toolchains.toml', '**/*.lock', '**/package-lock.json') }}
          restore-keys: quality-methods-${{ runner.arch }}-
      - name: Collect bounded unprivileged native evidence
        env:
          PHASE: ${{ steps.phase.outputs.name }}
          PROFILE: ${{ inputs.profile }}
          MODE: ${{ inputs.mode }}
          # Owner decision D1 is recorded in docs/plan/test-resource-limits/rl00bc-protocol.md.
          CRITERION_APPROVAL: "owner-D1-A-2026-11-09: rl00bc-protocol.md, protected p95 <= 2 x native p95 + 2 s"
        # sudo is limited by the collector to UUID-named finite transient units.
        # The owner reviews this workflow and protocol before a trigger ref push.
        run: |
          timeout --signal=TERM --kill-after=5s 2750s \
            env PYTHONPATH="$PWD/tools/quality" python3 -m tests.acceptance.rl00bc.rl00bc_driver \
            --phase "$PHASE" --profile "$PROFILE" --mode "$MODE" \
            --output "$PWD/reports/rl00bc" --scratch "$PWD/.gstack/tmp/rl00bc" \
            --samples 20 --criterion A --criterion-approval "$CRITERION_APPROVAL"
      - name: Summarize the recorded verdicts in the job log
        if: always()
        run: |
          python3 - <<'PY' || true
          import json
          from pathlib import Path

          root = Path("reports/rl00bc")


          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None


          phase = load(root / "phase.json")
          if phase is None:
              print("phase.json was not written")
          else:
              result = phase.get("result") or {}
              keys = ("status", "verdict", "success", "prepared", "error")
              summary = {key: result[key] for key in keys if key in result}
              summary["collection_complete"] = phase.get("collection_complete")
              summary["comparison_passed"] = phase.get("comparison_passed")
              print("phase.json", json.dumps(summary, sort_keys=True))
          for name in ("outer.json", "outer-observation.json"):
              data = load(root / name)
              print(name, "missing" if data is None else json.dumps(data, sort_keys=True))
          for path in sorted(root.glob("prepare-*/result.json")):
              data = load(path) or {}
              keys = ("cause", "success", "native_status", "timed_out")
              print(path.parent.name, json.dumps({key: data.get(key) for key in keys}, sort_keys=True))
          log = root / "service.log"
          if log.is_file():
              print("service.log tail")
              print("\n".join(log.read_text(encoding="utf-8", errors="replace").splitlines()[-40:]))
          PY
      - name: Pack the records without artifact-unsafe file names
        if: always()
        # Dart event files contain a colon, which the artifact service refuses; tar keeps every name.
        run: |
          mkdir -p reports/rl00bc reports/upload
          tar --create --gzip --file reports/upload/rl00bc-records.tar.gz \
            --exclude='rl00bc/measurement/*/artifacts' --directory reports rl00bc
          cp reports/rl00bc/*.json reports/upload/ || true
          sha256sum reports/upload/rl00bc-records.tar.gz
      - name: Preserve source, producer and kernel records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rl00bc-${{ steps.phase.outputs.name }}-${{ inputs.profile }}-${{ inputs.mode }}-${{ inputs.runner }}
          path: reports/upload
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
