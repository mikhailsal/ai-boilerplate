# Opt-in maintainer RL00a experiment, excluded from exported projects.
# The source SHA and evidence are retained; this is not a required quality job.
name: resource-proof

on:
  push:
    branches: [spike/rl00a-proof]

permissions: {}

jobs:
  rl00a:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Check out the exact experimental revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove both delegation paths with unprivileged payloads
        # sudo provisions only UUID-named transient units with finite limits.
        # The guardian and test payload run as the ordinary runner user.
        run: |
          timeout --signal=TERM --kill-after=5s 240s \
            python3 tools/quality/tests/acceptance/rl00a/rl00a_driver.py \
            --manager system --output reports/rl00a
      - name: Preserve source identity and kernel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rl00a-evidence
          path: reports/rl00a
          if-no-files-found: error
